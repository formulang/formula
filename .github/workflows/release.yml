name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: node scripts/set-version.js --check
      - run: pnpm run build
      - run: pnpm run test
      - name: Check whether this version is already on npm
        id: version
        run: |
          VERSION="$(node scripts/set-version.js --check)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PUBLISH=false
          for PKG in definitions parser runner core-functions formatted-text; do
            if ! npm view "@formulang/$PKG@$VERSION" version >/dev/null 2>&1; then
              PUBLISH=true
              echo "@formulang/$PKG@$VERSION is not on npm yet."
            fi
          done
          if [ "$PUBLISH" = "false" ]; then
            echo "@formulang/*@$VERSION is already fully published — nothing to do."
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: pnpm -r publish --access public --no-git-checks
      - name: Tag and create the GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
          gh release create "v${{ steps.version.outputs.version }}" --generate-notes
